  schemas:
    WebhookNotification:
      type: array
      description: >
        Cuerpo enviado a la URL del webhook. Es un array con un elemento por
        cada registro de facturación

        incluido en el envío que generó la notificación.
      items:
        $ref: "#/components/schemas/WebhookNotificationItem"
      example:
        - uuid: b018ced3-b362-4494-8776-9eefff1c160c
          nif: A15022510
          serie: A
          numero: "34547"
          fecha_expedicion: 13-02-2026
          operacion: Alta
          url: https://prewww2.aeat.es/wlpl/TIKE-CONT/ValidarQR?nif=A15022510&numserie=A34547&fecha=13-02-2026&importe=242
          estado: Correcto
        - uuid: f4504c29-78ca-4491-9a10-b6b727a20c36
          nif: A15022510
          serie: A
          numero: "34548"
          fecha_expedicion: 13-02-2026
          operacion: Alta
          url: https://prewww2.aeat.es/wlpl/TIKE-CONT/ValidarQR?nif=A15022510&numserie=A34548&fecha=13-02-2026&importe=751
          estado: Aceptado con errores
          codigo_error: "2005"
          mensaje_error: El campo ImporteTotal tiene un valor incorrecto para el valor de
            los campos BaseImponibleOimporteNoSujeto, CuotaRepercutida y
            CuotaRecargoEquivalencia suministrados.
    WebhookNotificationItem:
      type: object
      description: >
        Resultado de un registro de facturación. La forma es idéntica a la que
        devolvería el endpoint

        `Estado registro` de las APIs de Verifactu o TicketBai.
      properties:
        uuid:
          type: string
          format: uuid
          description: Identificador del registro de facturación en nuestra plataforma.
          example: b018ced3-b362-4494-8776-9eefff1c160c
        nif:
          type: string
          description: NIF del emisor al que pertenece el registro.
          example: A15022510
        serie:
          type: string
          description: Serie de la factura.
          example: A
        numero:
          type: string
          description: Número de la factura.
          example: "34547"
        fecha_expedicion:
          type: string
          description: Fecha de expedición de la factura en formato `DD-MM-YYYY`.
          example: 13-02-2026
        operacion:
          type: string
          description: >
            Tipo de operación realizada sobre el registro. En las notificaciones
            de Verifactu los valores posibles son:

            <ul style="list-style: disc; margin-top: 6px; margin-bottom: 0px;">
              <li>Alta</li>
              <li>Subsanacion</li>
              <li>Anulación</li>
              <li>Alta (rechazo previo)</li>
              <li>Alta (rechazo previo de subsanacion)</li>
              <li>Anulación (rechazo previo)</li>
              <li>Anulación (sin registro)</li>
              <li>Anulación (rechazo previo sin registro)</li>
            </ul>


            En las notificaciones de TicketBai los valores posibles son:

            <ul style="list-style: disc; margin-top: 6px; margin-bottom: 0px;">
              <li>Alta</li>
              <li>Subsanacion</li>
              <li>Modificacion</li>
              <li>Anulación</li>
              <li>Anulación (rechazo previo)</li>
            </ul>
          example: Alta
        estado:
          type: string
          description: >
            Estado del registro de facturación. Los valores posibles coinciden
            con los del endpoint `Estado registro`:

            <ul style="list-style: disc; margin-top: 6px; margin-bottom: 0px;">
              <li>Pendiente: Registro encolado y no procesado aún.</li>
              <li>Correcto: Registro procesado correctamente por hacienda.</li>
              <li>Aceptado con errores: Aceptado con errores; se requiere subsanación o rectificativa.</li>
              <li>Incorrecto: Rechazado por hacienda; se requiere subsanación o rectificativa.</li>
              <li>Duplicado: No aceptado por existir un registro con la misma (serie, numero, fecha_expedicion).</li>
              <li>Anulado: Registro de anulación procesado correctamente.</li>
              <li>Factura inexistente: Anulación no aceptada por no existir la factura.</li>
              <li>No registrado: Rechazado por hacienda.</li>
              <li>Error servidor AEAT: Error transitorio en hacienda; se reintentará automáticamente.</li>
            </ul>
          example: Correcto
        url:
          type: string
          description: URL de verificación del código QR.
          example: https://prewww2.aeat.es/wlpl/TIKE-CONT/ValidarQR?nif=A15022510&numserie=A34547&fecha=13-02-2026&importe=242
        codigo_error:
          type: string
          description: >
            Código de error tal y como aparece en el sistema de hacienda. Solo
            presente en notificaciones de Verifactu y

            cuando `estado` indica error (`Aceptado con errores`, `Incorrecto`,
            `No registrado`, etc.).
          example: "2005"
        mensaje_error:
          type: string
          description: >
            Descripción del error tal y como aparece en el sistema de hacienda.
            Presente cuando `estado` indica error.
          example: El campo ImporteTotal tiene un valor incorrecto para el valor de los
            campos suministrados.
        estado_registro_duplicado:
          type: string
          description: >
            Estado del registro previamente existente. Solo presente en
            notificaciones de Verifactu cuando

            `estado` es `Duplicado`.
        tbai:
          type: string
          description: >
            Huella (hash) del registro TicketBai. Solo presente en
            notificaciones de TicketBai.
  responses:
    unauthorizedResponse:
      description: No autorizado — API key inválida o ausente.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
    serverErrorResponse:
      description: Error interno del servidor.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
    okResponse:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                description: Mensaje.
                type: string
                example: OK
    nifResponse:
      description: NIF
      content:
        application/json:
          schema:
            type: object
            properties:
              nif:
                description: NIF.
                type: string
                example: B86561412
              entorno:
                description: Entorno del NIF.
                type: string
                example: test
              hacienda:
                description: >
                  Hacienda a la que está vinculado el NIF. Los valores posibles
                  son:

                  <ol style="list-style-type: disc">
                    <li>verifactu</li>
                    <li>alava</li>
                    <li>guipuzcoa</li>
                    <li>vizcaya</li>
                  </ol>
                type: string
                example: verifactu
              webhooks:
                description: Lista de identificadores de los webhooks a los que esta asociado el
                  NIF.
                type: array
                items:
                  type: string
                  example: 17067405-8c32-4efe-a7cb-8fad93403997
              nombre:
                description: Nombre y apellidos o razón social del NIF.
                type: string
                example: Mi empresa SL
              activo:
                description: Indica si el NIF está activo o no.
                type: boolean
                example: true
              direccion:
                description: Dirección del NIF.
                type: string
                example: Calle Mayor 15
              cp:
                description: Código postal del NIF.
                type: string
                example: "28040"
              poblacion:
                description: Población del NIF.
                type: string
                example: Madrid
              provincia:
                description: Provincia del NIF.
                type: string
                example: Madrid
              fecha_creacion:
                description: Fecha de creación del NIF.
                type: string
                example: 2024-12-01T12:18:21.671Z
              fecha_modificacion:
                description: Fecha de la última modificación del NIF.
                type: string
                example: 2024-12-07T16:16:51.671Z
              pagado_hasta:
                type: string
                example: 2025-06-04T00:00:00.000Z
                description: >
                  Campo solo disponible para NIFs de producción, ya que son los
                  únicos por los que hay que pagar.

                  Este campo indica la fecha hasta la que se ha pagado el NIF.
                  En caso de que llegada esa fecha el NIF esté activo,

                  entonces se renovará automáticamente y dicha fecha se
                  actualizará automáticamente.
              representacion:
                enum:
                  - Correcto
                  - Rechazado
                  - Inexistente
                example: Correcto
                description: >
                  Indica el estado del modelo de representación del NIF. Los
                  valores posibles son:

                  <ul style="list-style-type: disc">
                    <li>Correcto: El modelo de representación se ha recibido y se ha validado correctamente.</li>
                    <li>Rechazado: El modelo de representación ha sido recibido pero no se ha podido validar.</li>
                    <li>Inexistente: No se ha recibido el modelo de representación firmado.</li>
                  </ul>


                  Para NIFs de producción se requiere que el estado de la
                  representación sea "Correcto" para poder

                  enviar facturas.
                type: string
              pdf:
                type: string
                example: https://bucket.com/4f4a6b5b-8c32-4efe-a7cb-8fad93403997.pdf
                description: >
                  URL donde está alojado el modelo de representación para este
                  NIF en caso de que haya sido enviada. Esta URL tiene una
                  validez

                  de 15 minutos desde el momento de realizar la petición.
              label:
                type: string
                example: Cliente A
                description: Etiqueta asociada al NIF. Puede ser `null` si no se ha asignado
                  ninguna.
    webhookResponse:
      description: Webhook
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                description: Identificador del webhook.
                type: string
              url:
                description: URL a la que se hará la llamada cuando se dispare el webhook.
                type: string
              entorno:
                description: Entorno del webhook. Puede ser "test" o "prod".
                type: string
              secret:
                description: Clave para generar la firma HMAC.
                type: string
              activo:
                description: Indica si el webhook está activo o no.
                type: boolean
              nifs:
                type: array
                description: >
                  Lista de NIFs. Cuando se envían registros de facturación para
                  cualquiera de estos NIFs, se dispara el webhook con el
                  resultado

                  de hacienda una vez obtenido.
                items:
                  type: string
            example:
              id: 17067405-8c32-4efe-a7cb-8fad93403997
              url: https://api.webdelcliente.com/webhook
              entorno: test
              secret: mi-secreto
              activo: true
              nifs:
                - B86561412
                - B01345232
