        Dejará de cobrarse lo correspondiente al NIF desactivado en caso de que
        se trate de un NIF en el entorno de producción. Cualquier NIF

        desactivado puede reactivarse en cualquier momento para seguir enviando
        facturas a la Hacienda correspondiente.


        &nbsp;


        <span style="color: red">IMPORTANTE</span>: Al desactivar un NIF,
        <u><strong>se borrarán los registros de facturación</strong></u> de
        dicho NIF 30 días después de haberlo desactivado.

        Si se reactiva antes de dicho período, entonces no se perderán los
        registros de facturación. Incluso aunque se borren los datos de
        facturación, se puede reactivar

        el NIF en cualquier momento y se podrán enviar facturas sin romper el
        encadenamiento. Recordamos que existen los endpoints de exportar XMLs en
        caso de querer

        conservar los datos de facturación.
