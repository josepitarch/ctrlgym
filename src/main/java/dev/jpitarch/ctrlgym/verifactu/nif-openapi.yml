  /representacion/estado/{nif}:
    get:
      summary: Estado de representación
      tags:
        - Modelo de representación
      parameters:
        - in: path
          name: nif
          schema:
            type: string
          required: true
          description: NIF correspondiente al emisor de las facturas
          example: B86561412
        - in: query
          name: refresh
          schema:
            type: boolean
          required: false
          description: >
            Solo aplica cuando hay una firma online en curso (estado
            <code>Pendiente</code> con <code>firma_remota: true</code>).

            Con <code>refresh=true</code> se reemite un enlace de firma nuevo
            para el mismo proceso (útil si el enlace devuelto

            anteriormente ha dejado de funcionar). Reutiliza el mismo proceso:
            no crea un proceso de firma nuevo, no se

            factura y no modifica la fecha de caducidad
            (<code>fecha_expiracion</code>).
      description: >
        Mediante este endpoint se puede obtener el estado de la representación
        para un NIF. Cuando hay una firma online

        en curso, la respuesta incluye además el enlace de firma, de forma que
        el titular pueda retomar el mismo proceso

        sin crear (y facturar) uno nuevo.
      x-codeSamples:
        - lang: Java
          label: Java
          source: >-
            import java.net.URI;

            import java.net.http.HttpClient;

            import java.net.http.HttpRequest;

            import java.net.http.HttpResponse;


            public class Main {
                public static void main(String[] args) throws Exception {
                    HttpClient client = HttpClient.newHttpClient();

                    HttpRequest request = HttpRequest.newBuilder()
                        .uri(URI.create("https://api.verifacti.com/representacion/estado/B86561412"))
                        .header("Authorization", "Bearer <API_KEY>")
                        .GET()
                        .build();

                    HttpResponse<String> response = client.send(request,
                        HttpResponse.BodyHandlers.ofString());

                    System.out.println(response.statusCode());
                    System.out.println(response.body());
                }
            }
      responses:
        "200":
          description: Estado de la representación
          content:
            application/json:
              schema:
                type: object
                properties:
                  estado:
                    description: >
                      Estado de la representación. Los valores posibles son:

                      <ul style="list-style-type: disc">
                        <li>Correcto: El modelo de representación se ha recibido y se ha validado correctamente.</li>
                        <li>Rechazado: El modelo de representación ha sido recibido pero no se ha podido validar.</li>
                        <li>Pendiente: Hay una firma online en curso (<code>firma_remota: true</code>).</li>
                        <li>Caducado: El proceso de firma online ha caducado o el firmante lo ha rechazado. Se puede iniciar un proceso nuevo.</li>
                        <li>Cancelado: La representación se ha cancelado. Se puede iniciar un proceso nuevo.</li>
                        <li>Inexistente: No se ha recibido el modelo de representación firmado.</li>
                      </ul>
                    enum:
                      - Correcto
                      - Rechazado
                      - Pendiente
                      - Caducado
                      - Cancelado
                      - Inexistente
                    type: string
                  error:
                    description: Mensaje de error cuando <code>estado=Rechazado</code>
                    type: string
                  firma_remota:
                    description: >
                      Presente con valor <code>true</code> cuando el estado
                      <code>Pendiente</code> corresponde a una firma

                      online en curso.
                    type: boolean
                  url:
                    description: >
                      Enlace de firma para continuar el proceso de firma online
                      en curso. Presente solo cuando el estado es

                      <code>Pendiente</code> con <code>firma_remota:
                      true</code>. Si el enlace almacenado no está disponible

                      se reemite uno nuevo automáticamente; con el parámetro
                      <code>refresh=true</code> se fuerza la reemisión.

                      No se devuelve en estados terminales.
                    type: string
                  fecha_expiracion:
                    description: >
                      Fecha y hora (ISO 8601) en la que caduca el proceso de
                      firma online en curso. Si el titular no

                      completa la firma antes de esta fecha, el estado pasará a
                      <code>Caducado</code> y será necesario

                      iniciar un proceso nuevo. Presente solo cuando el estado
                      es <code>Pendiente</code> con

                      <code>firma_remota: true</code>. No se devuelve en estados
                      terminales.
                    type: string
                    format: date-time
              examples:
                correcto:
                  summary: Representación firmada
                  value:
                    estado: Correcto
                firma_online_en_curso:
                  summary: Firma online en curso
                  value:
                    estado: Pendiente
                    firma_remota: true
                    url: https://saas.esignanywhere.net/workstepredirector/go#...
                    fecha_expiracion: 2026-07-11T10:30:00.000Z
        "401":
          $ref: "#/components/responses/unauthorizedResponse"
        "500":
          $ref: "#/components/responses/serverErrorResponse"
