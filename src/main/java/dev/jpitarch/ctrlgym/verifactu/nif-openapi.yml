  /representacion/firma_remota/{nif}:
    post:
      summary: Iniciar firma online
      x-badges:
        - name: BETA
          position: after
      tags:
        - Modelo de representación
      parameters:
        - in: path
          name: nif
          schema:
            type: string
          required: true
          description: NIF correspondiente al emisor de las facturas. Debe ser un DNI o
            NIE (personas físicas).
          example: 16085921K
      description: >
        Inicia un proceso de <strong>firma online</strong> del documento de
        otorgamiento de representación, con

        verificación de identidad y sin necesidad de certificado electrónico.
        Disponible únicamente para personas

        físicas (el NIF debe ser un DNI o NIE).


        &nbsp;


        Puedes ver el proceso completo que sigue el firmante, paso a paso y con
        capturas, en la guía

        <a href="https://verifacti.com/firma-online">Firma online del modelo de
        representación</a>.


        &nbsp;


        La verificación de identidad durante la firma se realiza con <strong>DNI
        o pasaporte</strong> (no con NIE).

        Un titular cuyo NIF sea un NIE puede firmar igualmente: debe
        identificarse con su <strong>pasaporte</strong>.

        En todos los casos, el nombre verificado durante la firma debe
        corresponder al titular del NIF según la AEAT;

        si no coincide, la firma se rechaza y la representación no queda
        validada.


        &nbsp;


        La respuesta es un JSON con el enlace de firma (<code>url</code>) para
        el titular del NIF, que también recibe el enlace por email. El estado
        del proceso se

        puede consultar con GET <code>/representacion/estado/:nif</code>, que
        mientras la firma está en curso también

        devuelve el enlace y la fecha de caducidad del proceso
        (<code>fecha_expiracion</code>); con

        PUT <code>/representacion/cancelar/:nif</code> se puede cancelar.


        &nbsp;


        La ceremonia de firma y el email de notificación se muestran en español
        por defecto; con el campo opcional

        <code>idioma</code> (<code>es</code> o <code>en</code>) se puede cambiar
        a inglés.


        &nbsp;


        Cada proceso de firma online tiene un coste de 2,90 € + IVA que se añade
        a la próxima factura; el coste se

        aplica al crear el proceso, aunque la firma no llegue a completarse. Si
        el proceso caduca o se cancela, se

        puede iniciar uno nuevo, que se cobra como una firma nueva.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - nombre
                - apellidos
                - municipio
                - calle
                - numero
                - email
              properties:
                nombre:
                  type: string
                  description: Obligatorio. Nombre de pila del firmante (titular del NIF). El
                    documento se rellena con el nombre completo, la
                    concatenación de <code>nombre</code> y
                    <code>apellidos</code>.
                apellidos:
                  type: string
                  description: Obligatorio. Apellidos del firmante.
                municipio:
                  type: string
                  description: Obligatorio. Municipio de residencia del emisor de las facturas.
                calle:
                  type: string
                  description: Obligatorio. Calle de residencia del emisor de las facturas.
                numero:
                  type: string
                  description: Obligatorio. Número de residencia del emisor de las facturas.
                email:
                  type: string
                  description: Obligatorio. Email del firmante. Recibirá en esta dirección la
                    notificación con el enlace de firma.
                idioma:
                  type: string
                  enum:
                    - es
                    - en
                  default: es
                  description: Opcional. Idioma de la ceremonia de firma y del email de
                    notificación que recibe el firmante (<code>es</code> o
                    <code>en</code>). Si se omite, se utiliza el español.
                notificacion:
                  type: object
                  description: Opcional. Personalización del email de notificación que recibe el
                    firmante. Si se omite, se utilizan los valores por defecto
                    de Verifacti.
                  properties:
                    remitente:
                      type: string
                      maxLength: 200
                      default: Verifacti
                      description: Nombre del remitente que se muestra en el email (máximo 200
                        caracteres).
                    asunto:
                      type: string
                      maxLength: 300
                      default: Firma del modelo de representación
                      description: Asunto del email (máximo 300 caracteres).
                    mensaje:
                      type: string
                      default: Para poder enviar facturas a Hacienda es necesario firmar el modelo de
                        representación. Pulsa el enlace para identificarte y
                        firmar.
                      description: Mensaje del cuerpo del email.
              example:
                nombre: Pablo
                apellidos: García Gómez
                municipio: Madrid
                calle: Gran Vía
                numero: "43"
                email: pablo@example.com
      x-codeSamples:
        - lang: Java
          label: Java
          source: >-
            import java.net.URI;

            import java.net.http.HttpClient;

            import java.net.http.HttpRequest;

            import java.net.http.HttpResponse;


            public class Main {
                public static void main(String[] args) throws Exception {
                    HttpClient client = HttpClient.newHttpClient();

                    String body = "{\"nombre\": \"Pablo\", \"apellidos\": \"García Gómez\", \"municipio\": \"Madrid\", \"calle\": \"Gran Vía\", \"numero\": \"43\", \"email\": \"pablo@example.com\"}";

                    HttpRequest request = HttpRequest.newBuilder()
                        .uri(URI.create("https://api.verifacti.com/representacion/firma_remota/16085921K"))
                        .header("Authorization", "Bearer <API_KEY>")
                        .header("Content-Type", "application/json")
                        .POST(HttpRequest.BodyPublishers.ofString(body))
                        .build();

                    HttpResponse<String> response = client.send(request,
                        HttpResponse.BodyHandlers.ofString());

                    System.out.println(response.statusCode());
                    System.out.println(response.body());
                }
            }
      responses:
        "200":
          description: Proceso de firma online creado
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    description: Enlace de firma para el titular del NIF. También se le envía por
                      email. Si se pierde, se puede recuperar con GET
                      <code>/representacion/estado/:nif</code>.
                example:
                  url: https://saas.esignanywhere.net/workstepredirector/go#...
        "400":
          description: Datos de entrada inválidos, el NIF no es un DNI/NIE, o ya existe
            una representación correcta o una firma en curso para el NIF
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "401":
          $ref: "#/components/responses/unauthorizedResponse"
        "402":
          description: >
            Pago requerido: la cuenta acumula firmas online pendientes de cobro
            y no se ha podido realizar el cargo

            con el método de pago de la suscripción. No se ha creado ningún
            proceso de firma. Revisa el método de

            pago y vuelve a intentarlo.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: No se han podido cobrar las firmas de representacion pendientes. Revisa
                  el metodo de pago de tu suscripcion e intentalo de nuevo.
        "500":
          $ref: "#/components/responses/serverErrorResponse"
        "502":
          description: >
            Error temporal al iniciar la firma online (proveedor de firma o
            procesamiento del cobro). No queda ningún

            proceso a medias; se puede reintentar pasados unos minutos.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: No se ha podido iniciar la firma remota. Intentalo de nuevo en unos
                  minutos.
