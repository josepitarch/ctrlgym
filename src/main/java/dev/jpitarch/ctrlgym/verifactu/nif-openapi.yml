      x-codeSamples:
        - lang: Java
          label: Java
          source: |-
            import java.net.URI;
            import java.net.http.HttpClient;
            import java.net.http.HttpRequest;
            import java.net.http.HttpResponse;

            public class Main {
                public static void main(String[] args) throws Exception {
                    HttpClient client = HttpClient.newHttpClient();

                    String body = """
                            {
                              "url": "https://api.webdelcliente.com/webhook",
                              "entorno": "test",
                              "secret": "mi-secreto",
                              "nifs": [
                                "B86561412",
                                "B01345232"
                              ]
                            }
                            """;

                    HttpRequest request = HttpRequest.newBuilder()
                        .uri(URI.create("https://api.verifacti.com/webhooks"))
                        .header("Authorization", "Bearer <API_KEY>")
                        .header("Content-Type", "application/json")
                        .POST(HttpRequest.BodyPublishers.ofString(body))
                        .build();

                    HttpResponse<String> response = client.send(request,
                        HttpResponse.BodyHandlers.ofString());

                    System.out.println(response.statusCode());
                    System.out.println(response.body());
                }
            }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - url
                - entorno
              properties:
                url:
                  description: URL a la que se hará la llamada cuando se dispare el webhook.
                  type: string
                entorno:
                  description: Entorno del webhook. Puede ser "test" o "prod".
                  type: string
                  enum:
                    - test
                    - prod
                secret:
                  description: >
                    Parámetro opcional. Una clave secreta que se comparte entre
                    nuestra API y el receptor del webhook. Se utiliza para
                    generar la

                    firma HMAC que acompaña a cada notificación. Al recibir un
                    webhook, el receptor puede usar esta clave para recalcular
                    la firma del

                    mensaje y compararla con la firma proporcionada en el header
                    `X-Webhook-Signature`. Si ambas firmas coinciden, se
                    confirma que el

                    mensaje es auténtico y no ha sido modificado.
                nifs:
                  description: >
                    Lista de NIFs. Cuando se envíen registros de facturación
                    para cualquiera de estos NIFs, se disparará el webhook con
                    el resultado

                    de hacienda una vez obtenido. Dichos NIFs debern estar dados
                    de alta en el entorno en que se está creando el webhook.
              example:
                url: https://api.webdelcliente.com/webhook
                entorno: test
                secret: mi-secreto
                nifs:
                  - B86561412
                  - B01345232
