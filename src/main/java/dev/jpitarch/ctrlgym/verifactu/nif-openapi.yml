  /nifs/validar:
    post:
      summary: Validar NIF en la AEAT
      tags:
        - Validación
      description: >
        Este endpoint permite validar que un NIF de una persona física o
        jurídica está identificado en la agencia tributaria. Este endpoint

        realiza una consulta al servicio que la agencia tributaria tiene para
        esta finalidad.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - nif
              properties:
                nif:
                  description: NIF de la persona física o jurídica sobre la que se quiere efectuar
                    la consulta de verificación.
                  type: string
                  example: B86561412
                nombre:
                  type: string
                  example: Mi empresa SL
                  description: >
                    Apellidos y nombre de la persona física o razón social de la
                    persona jurídica sobre la que se

                    quiere efectuar la consulta de verificación. Obligatorio
                    para personas físicas. Opcional en personas jurídicas.
      x-codeSamples:
        - lang: Java
          label: Java
          source: >-
            import java.net.URI;

            import java.net.http.HttpClient;

            import java.net.http.HttpRequest;

            import java.net.http.HttpResponse;


            public class Main {
                public static void main(String[] args) throws Exception {
                    HttpClient client = HttpClient.newHttpClient();

                    String body = """
                            {"nif": "B86561412", "nombre": "Mi empresa SL"}
                            """;

                    HttpRequest request = HttpRequest.newBuilder()
                        .uri(URI.create("https://api.verifacti.com/nifs/validar"))
                        .header("Authorization", "Bearer <API_KEY>")
                        .header("Content-Type", "application/json")
                        .POST(HttpRequest.BodyPublishers.ofString(body))
                        .build();

                    HttpResponse<String> response = client.send(request,
                        HttpResponse.BodyHandlers.ofString());

                    System.out.println(response.statusCode());
                    System.out.println(response.body());
                }
            }
      responses:
        "200":
          description: Respuesta de la AEAT
          content:
            application/json:
              schema:
                type: object
                properties:
                  nif:
                    description: NIF de la persona física o jurídica sobre la que se efectúa la
                      consulta.
                    type: string
                    example: B86561412
                  nombre:
                    description: Apellidos y nombre o razón social del NIF de la persona física o
                      jurídica.
                    type: string
                    example: Mi empresa SL
                  resultado:
                    type: string
                    example: IDENTIFICADO
                    description: >
                      Indica si el NIF está identificado o no. Para el caso de
                      personas físicas existen tres

                      casos posibles:
                        <ol style="list-style-type: disc">
                          <li>
                            IDENTIFICADO: Si el contribuyente se identifica con los datos identificativos aportados.
                            Se devuelven los datos de apellidos y nombre asociados al NIF.
                          </li>
                          <li>
                            NO IDENTIFICADO-SIMILAR: Si el contribuyente no se identifica con los datos identificativos
                            aportados por diferencias menores en los apellidos y nombre. Se devuelven los datos de apellidos
                            y nombre asociados al NIF.
                          </li>
                          <li>
                            NO IDENTIFICADO: Si el contribuyente no se identifica con los datos identificativos aportados.
                          </li>
                        </ol>

                      En el caso de entidades, no existe el resultado NO
                      IDENTIFICADO-SIMILAR pero se añaden estos dos resultados:
                        <ol style="list-style-type: disc">
                          <li>
                            IDENTIFICADO-BAJA: Si el contribuyente se identifica con el NIF aportado y está en estado baja.
                            Se devuelve el NIF actual y su razón social.
                          </li>
                          <li>
                            IDENTIFICADO-REVOCADO: Si el contribuyente se identifica con el NIF aportado y está en estado
                            baja por revocación del NIF. Se devuelve el NIF actual y su razón social.
                          </li>
                        </ol>
        "400":
          description: Datos de entrada inválidos
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "401":
          $ref: "#/components/responses/unauthorizedResponse"
        "500":
          description: Error interno del servidor o servicio de la AEAT no disponible
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
