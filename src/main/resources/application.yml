spring:
  application:
    name: ctrlgym
  datasource:
    url: jdbc:postgresql://${DB_HOST}:5432/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SUPABASE_URL}/auth/v1
  messages:
    basename: messages
    fallback-to-system-locale: false
    encoding: UTF-8
server:
  port: 80

stripe:
  secret-key: ${STRIPE_SECRET_KEY}
  whsec-account: ${STRIPE_WEBHOOK_SECRET}

supabase:
  url: ${SUPABASE_URL}
  service-role-key: ${SUPABASE_SECRET_KEY}

qr:
  jwt-secret: "tu-clave-secreta-muy-larga-de-al-menos-256-bits-aqui"
  expiration-seconds: 10

notifications:
  telegram:
    bot.token: ${TELEGRAM_BOT_TOKEN}
    chat.id: ${TELEGRAM_CHAT_ID}
