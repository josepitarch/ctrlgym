spring:
  application:
    name: ctrlgym
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: jdbc:postgresql://${DB_HOST}:5432/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 2
      maximum-pool-size: 5
      connection-timeout: 30000
  jpa:
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SUPABASE_URL}/auth/v1
  messages:
    basename: messages
    fallback-to-system-locale: false
    encoding: UTF-8
server:
  port: 80

stripe:
  secret-key: ${STRIPE_SECRET_KEY}
  whsec-account: ${STRIPE_WEBHOOK_SECRET}

supabase:
  url: ${SUPABASE_URL}
  service-role-key: ${SUPABASE_SECRET_KEY}

member-access-qr:
  private-key: ${MEMBER_ACCESS_QR_PRIVATE_KEY}
  expiration-seconds: 10

notifications:
  telegram:
    bot.token: ${TELEGRAM_BOT_TOKEN}
    chat.id: ${TELEGRAM_CHAT_ID}

storage:
  r2:
    account-id: ${R2_ACCOUNT_ID}
    access-key-id: ${R2_ACCESS_KEY_ID}
    secret-access-key: ${R2_SECRET_ACCESS_KEY}
    bucket: ${R2_BUCKET}
    public-url: ${R2_PUBLIC_URL}
